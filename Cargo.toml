[package]
name = "pigeonhole_protocols"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["David Stainton"]
homepage = "https://katzenpost.network"
description = "Protocols over Katzenpost's Pigeonhole storage: group chat, and services with their clients"
documentation = "https://docs.rs/pigeonhole_protocols/latest/pigeonhole_protocols/"
repository = "https://github.com/katzenpost/pigeonhole_protocols"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["katzenpost", "pigeonhole", "mixnet", "group-chat"]
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
# katzenpost/thin_client#100: the daemon's NIKE and sealed box requests.
katzenpost_thin_client = { git = "https://github.com/katzenpost/thin_client", rev = "2aff9881b07cd4604f957df619fa8dcbee5dded3" }
base64 = "0.22"
blake2 = "0.10"
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
hkdf = "0.12"
log = "0.4"
subtle = "2"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
ed25519-dalek = "2"
hex = "0.4"
indexmap = "2"
memsec = "0.7"
rand = "0.8"
redb = "2"
serde_cbor = "0.11"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["full"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "katzenqt1-rs"
path = "src/bin/katzenqt1.rs"

[[bin]]
name = "eliza"
path = "src/bin/eliza.rs"
