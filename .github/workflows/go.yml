name: go
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/verify-testdata.sh
      - run: go vet ./...
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin katzenqt1-rs
      - run: mkdir -p "$RUNNER_TEMP/tmp" && TMPDIR="$RUNNER_TEMP/tmp" RUST_BIN="$PWD/target/release/katzenqt1-rs" go test -short ./...
      # The services on localnet, with real CTIDH replicas: longer than go test's default timeout.
      - run: mkdir -p "$RUNNER_TEMP/tmp" && TMPDIR="$RUNNER_TEMP/tmp" go test -v -timeout 30m ./services/interop/
